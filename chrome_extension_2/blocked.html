<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page blocked</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card stack">
        <h1>This page was blocked</h1>
        <p class="lede" id="reason">Durin stopped this tab.</p>
        <p class="muted">Original URL</p>
        <p class="url" id="blocked-url"></p>
        <div id="score-wrap" hidden>
          <p class="muted">Off-task confidence</p>
          <p class="score" id="score"></p>
        </div>
      </section>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
